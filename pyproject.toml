[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphids"
version = "0.1.0"
description = "Reprodução do GraphIDS (NeurIPS 2025) - Equipe 10, CIN0114"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.17.0"]

[tool.setuptools.packages.find]
include = ["graphids*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
