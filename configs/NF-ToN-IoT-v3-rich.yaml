# NF-ToN-IoT-v3 com Agregador Rico (mean + max + log_degree).
# Hipótese da F4: preservar picos extremos e volume de tráfego para melhorar
# a detecção de ataques de varredura (Scanning) e volumétricos (DoS/DDoS).
dataset: NF-ToN-IoT-v3
fraction: 0.2
drop_timestamps: true
edim_out: 96
nhops: 1
fanout: 32768
agg_type: rich
gnn_dropout: 0.6
num_layers: 1
num_heads: 4
embed_dim: 48
ff_dim: 256
window_size: 512
mask_ratio: 0.15
ae_dropout: 0.0
learning_rate: 1.0e-4
gnn_weight_decay: 0.6
ae_weight_decay: 0.04
gnn_batch_size: 16384
ae_batch_size: 64
num_epochs: 100
patience: 20
