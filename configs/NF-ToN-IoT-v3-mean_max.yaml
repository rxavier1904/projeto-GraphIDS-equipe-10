# NF-ToN-IoT-v3 com Agregador Híbrido (mean + max).
# Hipótese da F4: combinar o perfil de fundo (média) com os picos anômalos (máximo).
dataset: NF-ToN-IoT-v3
run_name: NF-ToN-IoT-v3-mean_max
fraction: 0.2
drop_timestamps: true
edim_out: 96
nhops: 1
fanout: 32768
agg_type: mean_max
gnn_dropout: 0.6
num_layers: 1
num_heads: 4
embed_dim: 48
ff_dim: 256
window_size: 512
mask_ratio: 0.15
ae_dropout: 0.0
learning_rate: 1.0e-4
gnn_weight_decay: 0.6
ae_weight_decay: 0.04
gnn_batch_size: 16384
ae_batch_size: 64
num_epochs: 100
patience: 20
